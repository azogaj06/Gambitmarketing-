    .top .links { display: flex; gap: 22px; align-items: center; }
    .top .ig-icon { display: inline-flex; padding: 6px; margin: -6px; transition: opacity .2s; }
    .top .ig-icon svg { width: 20px; height: 20px; display: block; }
    .top .ig-icon:hover { opacity: .65; }
    .top .cta { font-family: var(--mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; text-decoration: none; border-bottom: 1px solid currentColor; padding-bottom: 3px; }
    .top .cta:hover { border-bottom-color: var(--accent-on-dark); }

    main { padding: 112px var(--gutter) clamp(72px, 10vw, 140px); }
    .split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 3fr); gap: 32px var(--gutter); }
    .split .label { position: sticky; top: 88px; align-self: start; font-size: clamp(15px, 1.35vw, 19px); letter-spacing: .12em; color: var(--muted-inv); }
    h1.big { font-size: clamp(32px, 4.6vw, 72px); line-height: 1; letter-spacing: -.035em; font-weight: 700; text-wrap: balance; max-width: 17ch; }
    .lede { font-size: clamp(18px, 1.5vw, 21px); line-height: 1.45; max-width: 50ch; margin-top: 28px; color: var(--muted-inv); }
    .lede a { text-decoration: none; border-bottom: 1px solid currentColor; }
    .count { margin-top: 18px; color: var(--muted-inv); }

    .gallery { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 48px; }
    .clip { position: relative; display: block; aspect-ratio: 9 / 16; background: #141416; color: var(--white); overflow: hidden; text-decoration: none; cursor: pointer; }
    .clip video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .clip .fallback { position: absolute; inset: 0; padding: 18px; color: inherit; text-decoration: none; display: flex; flex-direction: column; justify-content: flex-end; gap: 12px; opacity: 0; pointer-events: none; transition: opacity .3s; }
    .clip.missing .fallback { opacity: 1; pointer-events: auto; }
    .clip .fallback .mark { height: 34px; }
    .clip .fallback span:last-child { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
    .clip .sound { position: absolute; right: 10px; bottom: 10px; width: 36px; height: 36px; display: grid; place-items: center; padding: 0; background: rgba(11, 11, 13, .55); color: var(--white); border: 1px solid rgba(244,244,242,.25); cursor: pointer; transition: background .2s, border-color .2s; }
    .clip .sound svg { width: 18px; height: 18px; }
    .clip .sound .wave { opacity: 0; }
    .clip.on .sound { background: var(--accent); border-color: var(--accent); }
    .clip.on .sound .wave { opacity: 1; }
    .clip.on .sound .slash { opacity: 0; }
    .clip.missing .sound { display: none; }
    .clip:focus-within .sound { outline: 2px solid var(--white); outline-offset: 2px; }

    .more-btn { margin-top: 32px; display: inline-flex; align-items: center; gap: 12px; padding: 16px 22px; background: var(--white); color: var(--black); border: 1px solid var(--white); font-weight: 600; letter-spacing: -.01em; cursor: pointer; transition: background .25s, color .25s; }
    .more-btn:hover { background: transparent; color: var(--white); }
    .more-btn[hidden] { display: none; }
    .empty { margin-top: 48px; padding: 28px 0; border-top: 1px solid var(--line-inv); border-bottom: 1px solid var(--line-inv); color: var(--muted-inv); }

    .foot-bar { padding: 26px var(--gutter); display: flex; flex-wrap: wrap; gap: 16px 40px; justify-content: space-between; align-items: center; font-family: var(--mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; border-top: 1px solid var(--line-inv); }
    .foot-bar ul { list-style: none; padding: 0; display: flex; gap: 24px; flex-wrap: wrap; }
    .foot-bar a { text-decoration: none; opacity: .7; transition: opacity .2s; }
    .foot-bar a:hover { opacity: 1; }
    .foot-bar a.plain { text-transform: none; letter-spacing: 0; }

    @media (max-width: 860px) {
      .split { grid-template-columns: 1fr; gap: 24px; }
      .split .label { position: static; }
      .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .foot-bar { justify-content: flex-start; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>

<body>
  <header class="top">
    <a class="brand" href="index.html"><span class="mark" aria-hidden="true"></span>Gambit</a>
    <nav class="links"><a class="ig-icon" href="https://www.instagram.com/shotbygambit/" target="_blank" rel="me noopener" aria-label="Gambit on Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.3" cy="6.7" r="1" fill="currentColor" stroke="none"/></svg></a><a class="cta" href="index.html">Home</a><a class="cta" href="index.html#contact">Email us</a></nav>
  </header>

  <main>
    <div class="split">
      <div class="label mono"><span>The work</span></div>
      <div class="body">
        <h1 class="big">Everything we've made.</h1>
        <p class="lede">Tap any video for sound. New work lands here first, and the rest is on <a href="https://www.instagram.com/shotbygambit/" target="_blank" rel="me noopener">Instagram</a>.</p>
        <p class="count mono" id="count"></p>
        <div class="gallery" id="gallery"></div>
        <p class="empty" id="empty" hidden>Nothing here yet. Check back soon.</p>
        <button class="more-btn" id="more" type="button" hidden>Show more</button>
      </div>
    </div>
  </main>

  <footer class="foot-bar">
    <span>&copy; <span id="year">2026</span> Gambit Marketing</span>
    <ul>
      <li><a class="plain" href="https://www.instagram.com/shotbygambit/" target="_blank" rel="me noopener">Instagram @shotbygambit</a></li>
      <li><a class="plain" href="mailto:gambitmkt07@gmail.com">gambitmkt07@gmail.com</a></li>
    </ul>
    <a href="index.html">Back to the site</a>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    (() => {
      const all = [];
      const setSound = (clip, on) => {
        const v = clip.querySelector('video'); if (!v) return;
        v.muted = !on; clip.classList.toggle('on', on);
        const b = clip.querySelector('.sound');
        if (b) { b.setAttribute('aria-pressed', String(on)); b.setAttribute('aria-label', on ? 'Turn sound off' : 'Turn sound on'); }
      };
      const io = new IntersectionObserver((entries) => {
        entries.forEach((e) => {
          const clip = e.target, v = clip.querySelector('video');
          if (!v || clip.classList.contains('missing')) return;
          if (e.isIntersecting) { v.play().catch(() => {}); } else { v.pause(); setSound(clip, false); }
        });
      }, { threshold: .35 });
      const setup = (clip) => {
        const v = clip.querySelector('video'); if (!v) return;
        const src = v.querySelector('source');
        const missing = () => { clip.classList.add('missing'); v.remove(); };
        src.addEventListener('error', missing);
        v.addEventListener('error', missing);
        if (v.error) missing();
        clip.addEventListener('click', (ev) => {
          if (clip.classList.contains('missing') || !v.isConnected) return;
          ev.preventDefault();
          const on = v.muted;
          all.forEach((c) => { if (c !== clip) setSound(c, false); });
          setSound(clip, on);
          if (on) { v.currentTime = 0; v.play().catch(() => {}); }
        });
        all.push(clip); io.observe(clip);
      };

      const gallery = document.getElementById('gallery'), more = document.getElementById('more'), count = document.getElementById('count'), empty = document.getElementById('empty');
      const IG = 'https://www.instagram.com/shotbygambit/';
      const SPEAKER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="wave" d="M16 9.5a4 4 0 0 1 0 5M18.5 7a7.5 7.5 0 0 1 0 10"/><path class="slash" d="M3 3l18 18"/></svg>';
      const tile = (base) => {
        const el = document.createElement('div'); el.className = 'clip';
        el.innerHTML = '<video muted loop playsinline preload="metadata" poster="' + base + '.jpg"><source src="' + base + '.mp4" type="video/mp4"></video>'
          + '<button class="sound" type="button" aria-label="Turn sound on" aria-pressed="false">' + SPEAKER + '</button>'
          + '<a class="fallback" href="' + IG + '" target="_blank" rel="noopener" tabindex="-1"><span class="mark" aria-hidden="true"></span><span>Watch on Instagram</span></a>';
        return el;
      };
      const PAGE = 12;
      const items = ['assets/clips/clip-1', 'assets/clips/clip-2', 'assets/clips/clip-3', 'assets/clips/clip-4'];
      let shown = 0;
      const render = () => {
        items.slice(shown, shown + PAGE).forEach((b) => { const el = tile(b); gallery.appendChild(el); setup(el); shown++; });
        more.hidden = shown >= items.length;
        empty.hidden = items.length > 0;
        count.textContent = items.length ? (items.length + (items.length === 1 ? ' video' : ' videos')) : '';
      };
      more.addEventListener('click', render);
      render();
      (async () => {
        for (let i = 1; i <= 200; i++) {
          try { const r = await fetch('assets/gallery/gallery-' + i + '.mp4', { method: 'HEAD' }); if (!r.ok) break; items.push('assets/gallery/gallery-' + i); }
          catch (_) { break; }
        }
        if (shown < PAGE) render(); else { more.hidden = shown >= items.length; count.textContent = items.length + ' videos'; }
      })();
    })();
  </script>
